spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
springdoc:
  swagger-ui:
    persist-authorization: false
